<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f97316">
  <title>Commande Resto</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { padding-bottom: env(safe-area-inset-bottom); }
:root {
  --resto-primary: #ea6b32;
  --resto-primary-dark: #d95722;
  --resto-ink: #29251f;
  --resto-muted: #81796f;
  --resto-bg: #f7f5f1;
  --resto-card: #ffffff;
  --resto-line: #eee9e2;
  --resto-radius: 18px;
}

body {
  background: var(--resto-bg);
  color: var(--resto-ink);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

button, input, textarea {
  font: inherit;
}

.btn {
  min-height: 42px;
  border-radius: 12px;
  font-weight: 650;
  text-transform: none;
  transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
}

.btn:active {
  transform: scale(.97);
}

.btn-primary {
  background: var(--resto-primary);
  border-color: var(--resto-primary);
  color: #fff;
  box-shadow: 0 5px 14px rgba(234, 107, 50, .17);
}

.btn-primary:hover {
  background: var(--resto-primary-dark);
  border-color: var(--resto-primary-dark);
}

.input, .textarea, .select {
  border-color: #e9e3da;
  border-radius: 12px;
  background: #fff;
  outline: none;
}

.input:focus, .textarea:focus, .select:focus {
  border-color: var(--resto-primary);
  outline: 2px solid rgba(234, 107, 50, .12);
  outline-offset: 0;
}

.card {
  border: 1px solid rgba(45, 35, 25, .045);
  border-radius: var(--resto-radius);
  overflow: hidden;
  box-shadow: 0 3px 14px rgba(40, 30, 20, .035);
}

.badge {
  font-weight: 650;
  border-radius: 8px;
}

#app {
  min-height: 100vh;
}

.client-shell {
  max-width: 680px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--resto-bg);
  padding-bottom: 105px;
}

.client-header {
  background: #29251f;
  color: #fff;
  padding: 25px 20px 23px;
  border-radius: 0 0 24px 24px;
  box-shadow: 0 8px 22px rgba(40, 30, 20, .12);
}

.client-header .restaurant-eyebrow {
  color: #f6b58f;
  font-size: 11px;
  font-weight: 750;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.client-header h1 {
  font-size: 26px;
  font-weight: 850;
  letter-spacing: -.8px;
  margin-top: 5px;
}

.client-header .table-pill {
  background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.15);
  color: white;
  border-radius: 30px;
  padding: 8px 12px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}

.client-welcome {
  padding: 22px 17px 12px;
}

.client-welcome h2 {
  font-size: 21px;
  font-weight: 850;
  letter-spacing: -.5px;
}

.client-welcome p {
  font-size: 13px;
  color: var(--resto-muted);
  margin-top: 4px;
}

.client-categories {
  display: flex;
  gap: 9px;
  overflow-x: auto;
  padding: 7px 16px 15px;
  scrollbar-width: none;
}

.client-categories::-webkit-scrollbar {
  display: none;
}

.client-categories .tab {
  flex: 0 0 auto;
  height: 39px;
  min-height: 39px;
  padding: 0 17px;
  border-radius: 30px;
  background: #fff;
  border: 1px solid var(--resto-line);
  color: #625a51;
  font-size: 13px;
  font-weight: 700;
}

.client-categories .tab-active {
  background: var(--resto-ink);
  color: #fff;
  border-color: var(--resto-ink);
}

.client-items {
  padding: 0 15px;
  display: grid;
  gap: 11px;
}

.client-item {
  background: #fff;
  border: 1px solid var(--resto-line);
  border-radius: 17px;
  padding: 15px;
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  transition: box-shadow .2s ease;
}

.client-item:active {
  box-shadow: 0 4px 15px rgba(40, 30, 20, .08);
}

.client-item-info {
  flex: 1;
  min-width: 0;
}

.client-item-name {
  font-size: 15px;
  font-weight: 800;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

.client-item-desc {
  font-size: 12px;
  color: var(--resto-muted);
  line-height: 1.5;
  margin-top: 5px;
}

.client-item-price {
  color: var(--resto-primary);
  font-weight: 850;
  font-size: 14px;
  margin-top: 8px;
}

.client-item-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.client-item-actions .btn {
  width: 35px;
  height: 35px;
  min-height: 35px;
  padding: 0;
}

.client-cart-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 30;
  padding: 12px 15px calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(transparent, rgba(247,245,241,.97) 20%);
}

.client-cart-bar .btn {
  max-width: 650px;
  min-height: 57px;
  border-radius: 16px;
  padding: 0 19px;
  font-size: 14px;
  box-shadow: 0 7px 24px rgba(190, 77, 30, .22);
}

.client-cart-bar .cart-total {
  font-size: 15px;
  font-weight: 850;
}

#cart-modal .modal-box {
  border-radius: 24px 24px 0 0;
  max-height: 90dvh;
  padding: 22px;
}

#cart-body h3 {
  font-size: 20px;
  font-weight: 850;
}

#track-banner .alert {
  border-radius: 14px;
  background: #fff;
  border: 1px solid var(--resto-line);
}

.admin-shell {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px 18px 45px;
}

.admin-header {
  background: #29251f;
  color: #fff;
  padding: 19px 21px;
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  box-shadow: 0 6px 20px rgba(40, 30, 20, .1);
}

.admin-brand {
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 0;
}

.admin-brand-icon {
  width: 43px;
  height: 43px;
  display: grid;
  place-items: center;
  background: rgba(234,107,50,.18);
  border: 1px solid rgba(234,107,50,.25);
  border-radius: 13px;
  font-size: 21px;
}

.admin-brand-name {
  font-size: 17px;
  font-weight: 850;
  overflow-wrap: anywhere;
}

.admin-brand-subtitle {
  color: #c5bdb3;
  font-size: 11px;
  margin-top: 2px;
}

.admin-header .btn {
  background: rgba(255,255,255,.1);
  border-color: rgba(255,255,255,.12);
  color: white;
}

.admin-navigation {
  display: flex;
  gap: 7px;
  margin: 17px 0;
  padding: 6px;
  background: #fff;
  border: 1px solid var(--resto-line);
  border-radius: 15px;
}

.admin-navigation .tab {
  flex: 1;
  min-width: 0;
  height: 44px;
  min-height: 44px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 750;
  color: var(--resto-muted);
}

.admin-navigation .tab-active {
  background: #29251f;
  color: #fff;
}

.admin-panel-title {
  font-size: 21px;
  font-weight: 850;
  letter-spacing: -.5px;
  margin-bottom: 4px;
}

.admin-panel-subtitle {
  color: var(--resto-muted);
  font-size: 12px;
  margin-bottom: 17px;
}

.admin-order-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
  align-items: start;
}

.admin-order-column {
  min-width: 0;
  background: #f0ede8;
  border-radius: 16px;
  padding: 11px;
}

.admin-order-column-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 850;
  padding: 4px 3px 11px;
}

.admin-order-card {
  background: #fff;
  border: 1px solid #eae5de;
  border-radius: 13px;
  padding: 13px;
  margin-bottom: 9px;
  box-shadow: 0 2px 7px rgba(40,30,20,.025);
}

.admin-order-card:last-child {
  margin-bottom: 0;
}

.admin-order-card .order-customer {
  font-size: 14px;
  font-weight: 850;
  line-height: 1.4;
}

.admin-order-card .order-meta {
  color: var(--resto-muted);
  font-size: 10px;
  margin-top: 4px;
}

.admin-order-card .order-items {
  border-top: 1px solid var(--resto-line);
  border-bottom: 1px solid var(--resto-line);
  padding: 10px 0;
  margin: 10px 0;
  font-size: 12px;
  line-height: 1.8;
}

.admin-order-card .order-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.admin-order-card .order-total {
  font-size: 14px;
  font-weight: 850;
}

.admin-order-card .btn {
  min-height: 34px;
  height: 34px;
  padding: 0 10px;
  font-size: 11px;
}

.menu-editor {
  display: grid;
  gap: 13px;
}

.menu-toolbar {
  background: #fff;
  border: 1px solid var(--resto-line);
  border-radius: 15px;
  padding: 13px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 9px;
}

.menu-category {
  background: #fff;
  border: 1px solid var(--resto-line);
  border-radius: 16px;
  padding: 15px;
}

.menu-category-title {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 13px;
}

.menu-category-title .input {
  font-weight: 800;
}

.menu-item-editor {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(90px, .8fr) minmax(0, 1.5fr) auto auto;
  align-items: center;
  gap: 8px;
  border-top: 1px solid var(--resto-line);
  padding: 12px 0;
}

.menu-category .btn {
  font-size: 12px;
}

.qr-config {
  background: #fff;
  border: 1px solid var(--resto-line);
  border-radius: 16px;
  padding: 17px;
  margin-bottom: 15px;
}

.qr-config-title {
  font-weight: 850;
  font-size: 16px;
  margin-bottom: 12px;
}

#qr-grid {
  gap: 14px;
}

.qr-card {
  border-radius: 15px;
  border: 1px solid #e9e3da;
  overflow: hidden;
}

.qr-card .card-body {
  padding: 17px;
}

.login-card {
  max-width: 420px;
  margin: 50px auto;
  background: #fff;
  border: 1px solid var(--resto-line);
  border-radius: 22px;
  box-shadow: 0 15px 45px rgba(40,30,20,.08);
}

.login-card .card-body {
  padding: 27px;
  gap: 12px;
}

.login-logo {
  width: 57px;
  height: 57px;
  display: grid;
  place-items: center;
  border-radius: 17px;
  background: #fff0e8;
  font-size: 28px;
  margin-bottom: 5px;
}

.login-card h1 {
  font-size: 22px;
  font-weight: 850;
}

.login-card .login-subtitle {
  font-size: 13px;
  color: var(--resto-muted);
  margin-top: -6px;
  margin-bottom: 9px;
}

#toast .alert {
  border-radius: 13px;
  font-size: 13px;
  font-weight: 650;
  box-shadow: 0 7px 22px rgba(0,0,0,.12);
}

@media (max-width: 760px) {
  .admin-shell {
    padding: 12px 11px 35px;
  }

  .admin-order-grid {
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .admin-order-column {
    padding: 10px;
  }

  .admin-order-card {
    padding: 12px;
  }

  .menu-item-editor {
    grid-template-columns: minmax(0, 1fr) 95px auto;
    gap: 7px;
  }

  .menu-item-editor .menu-field-name {
    grid-column: 1 / 3;
  }

  .menu-item-editor .menu-field-price {
    grid-column: 1 / 2;
  }

  .menu-item-editor .menu-field-desc {
    grid-column: 1 / 3;
  }

  .menu-item-editor .menu-field-availability {
    grid-column: 2 / 3;
  }

  .menu-item-editor .menu-field-delete {
    grid-column: 3 / 4;
    grid-row: 1 / 3;
  }

  .login-card {
    margin: 25px 12px;
  }
}

@media (max-width: 380px) {
  .client-header h1 {
    font-size: 22px;
  }

  .client-item {
    padding: 12px;
    gap: 8px;
  }

  .client-item-name {
    font-size: 14px;
  }

  .admin-brand-name {
    font-size: 14px;
  }

  .admin-navigation .tab {
    font-size: 11px;
    padding: 0 5px;
  }
}

@media print {
  body {
    background: white;
  }
}
    .qr-card canvas, .qr-card img { margin: 0 auto; }
    @media print {
      body * { visibility: hidden; }
      #qr-print, #qr-print * { visibility: visible; }
      #qr-print { position: absolute; left: 0; top: 0; width: 100%; }
      .qr-card { break-inside: avoid; border: 1px solid #000; }
    }
  </style>

<script type="text/plain" id="worker-source">
/**
 * Cloudflare Worker — API REST pour SaaS de commande restaurant (multi-tenant)
 *
 * Binding KV requis : ORDERS_KV
 * Variables / secrets :
 *   ADMIN_PIN  → code PIN admin par défaut
 *   PINS       → (optionnel) JSON { "mimo": "1234", "autre": "9999" } pour un PIN par restaurant
 *
 * Clés KV :
 *   menu:{restaurantId}    → { currency, categories:[{ id, name, items:[{ id, name, price, desc, available }] }] }
 *   orders:{restaurantId}  → [ { id, table, customer, items, total, note, status, createdAt, updatedAt } ]
 */

const CORS = {
  'Access-Control-Allow-Origin': '*',
  'Access-Control-Allow-Methods': 'GET, POST, OPTIONS',
  'Access-Control-Allow-Headers': 'Content-Type, X-Admin-Pin',
  'Access-Control-Max-Age': '86400',
};

const STATUSES = ['pending', 'preparing', 'ready', 'served'];
const MAX_ORDERS = 300;

export default {
  async fetch(request, env) {
    if (request.method === 'OPTIONS') return new Response(null, { status: 204, headers: CORS });
    try {
      return await route(request, env, new URL(request.url));
    } catch (err) {
      console.error(err);
      return json({ error: 'Erreur serveur' }, 500);
    }
  },
};

/* ---------- Routage ---------- */

async function route(request, env, url) {
  const { pathname } = url;
  const method = request.method;
  const body = method === 'POST' ? await request.json().catch(() => ({})) : {};
  const rid = cleanId(url.searchParams.get('restaurant') || body.restaurant);

  if (!pathname.startsWith('/api/')) return json({ error: 'Not found' }, 404);
  if (!rid) return json({ error: 'restaurant invalide' }, 400);

  // --- Public ---
  if (pathname === '/api/menu' && method === 'GET') {
    return json(await getMenu(env, rid));
  }

  if (pathname === '/api/order' && method === 'POST') {
    return createOrder(env, rid, body);
  }

  if (pathname === '/api/order' && method === 'GET') {
    // Suivi côté client : renvoie uniquement l'état de SA commande
    const id = String(url.searchParams.get('id') || '');
    const order = (await getOrders(env, rid)).find((o) => o.id === id);
    if (!order) return json({ error: 'Commande introuvable' }, 404);
    return json({ id: order.id, status: order.status });
  }

  // --- Admin (PIN requis) ---
  if (!isAdmin(request, env, rid)) return json({ error: 'PIN invalide' }, 401);

  if (pathname === '/api/auth' && method === 'POST') {
    return json({ ok: true });
  }

  if (pathname === '/api/orders' && method === 'GET') {
    return json({ orders: await getOrders(env, rid) });
  }

  if (pathname === '/api/status' && method === 'POST') {
    const status = String(body.status || '');
    if (!STATUSES.includes(status)) return json({ error: 'Statut invalide' }, 400);
    const orders = await getOrders(env, rid);
    const order = orders.find((o) => o.id === body.id);
    if (!order) return json({ error: 'Commande introuvable' }, 404);
    order.status = status;
    order.updatedAt = Date.now();
    await env.ORDERS_KV.put(`orders:${rid}`, JSON.stringify(orders));
    return json({ ok: true, order });
  }

  if (pathname === '/api/menu' && method === 'POST') {
    const menu = sanitizeMenu(body.menu);
    await env.ORDERS_KV.put(`menu:${rid}`, JSON.stringify(menu));
    return json({ ok: true, menu });
  }

  return json({ error: 'Not found' }, 404);
}

/* ---------- Commandes ---------- */

async function createOrder(env, rid, body) {
  const menu = await getMenu(env, rid);
  const catalog = new Map();
  menu.categories.forEach((c) => c.items.forEach((i) => catalog.set(i.id, i)));

  const table = str(body.table, 10);
  const customer = str(body.customer, 60);
  if (!table || !customer) return json({ error: 'Table et nom requis' }, 400);
  if (!Array.isArray(body.items) || !body.items.length || body.items.length > 50) {
    return json({ error: 'Panier invalide' }, 400);
  }

  // Les prix sont recalculés côté serveur depuis le menu : jamais ceux envoyés par le client
  const items = [];
  let total = 0;
  for (const line of body.items) {
    const item = catalog.get(String(line.id));
    const qty = Math.floor(Number(line.qty));
    if (!item || item.available === false || !(qty >= 1 && qty <= 50)) {
      return json({ error: 'Article indisponible ou invalide' }, 400);
    }
    items.push({ id: item.id, name: item.name, price: item.price, qty });
    total += item.price * qty;
  }

  const order = {
    id: crypto.randomUUID().slice(0, 6).toUpperCase(),
    table,
    customer,
    items,
    total,
    note: str(body.note, 300),
    status: 'pending',
    createdAt: Date.now(),
    updatedAt: Date.now(),
  };

  const orders = await getOrders(env, rid);
  orders.push(order);
  // On borne la taille de la liste pour rester sous la limite de valeur KV
  await env.ORDERS_KV.put(`orders:${rid}`, JSON.stringify(orders.slice(-MAX_ORDERS)));
  return json({ ok: true, id: order.id, total });
}

async function getOrders(env, rid) {
  return (await env.ORDERS_KV.get(`orders:${rid}`, 'json')) || [];
}

/* ---------- Menu ---------- */

async function getMenu(env, rid) {
  return (await env.ORDERS_KV.get(`menu:${rid}`, 'json')) || { currency: 'DA', categories: [] };
}

function sanitizeMenu(input) {
  const menu = { currency: str(input?.currency, 8) || 'DA', categories: [] };
  const categories = Array.isArray(input?.categories) ? input.categories.slice(0, 50) : [];
  let count = 0;

  for (const c of categories) {
    const cat = { id: cleanId(c.id) || newId(), name: str(c.name, 60) || 'Sans nom', items: [] };
    for (const i of Array.isArray(c.items) ? c.items : []) {
      if (++count > 300) break;
      cat.items.push({
        id: cleanId(i.id) || newId(),
        name: str(i.name, 80) || 'Sans nom',
        price: Math.max(0, Number(i.price) || 0),
        desc: str(i.desc, 200),
        available: i.available !== false,
      });
    }
    menu.categories.push(cat);
  }
  return menu;
}

/* ---------- Utilitaires ---------- */

function isAdmin(request, env, rid) {
  let expected = env.ADMIN_PIN || '';
  try {
    const map = JSON.parse(env.PINS || '{}');
    if (map[rid]) expected = String(map[rid]);
  } catch (_) { /* PINS mal formé : on garde ADMIN_PIN */ }
  const given = request.headers.get('X-Admin-Pin') || '';
  return expected !== '' && safeEqual(given, expected);
}

// Comparaison en temps quasi constant
function safeEqual(a, b) {
  const len = Math.max(a.length, b.length);
  let diff = a.length ^ b.length;
  for (let i = 0; i < len; i++) diff |= (a.charCodeAt(i) || 0) ^ (b.charCodeAt(i) || 0);
  return diff === 0;
}

const cleanId = (v) => (/^[a-zA-Z0-9_-]{1,40}$/.test(String(v || '')) ? String(v) : '');
const newId = () => crypto.randomUUID().slice(0, 8);
const str = (v, max) => String(v ?? '').trim().slice(0, max);
const json = (data, status = 200) =>
  new Response(JSON.stringify(data), {
    status,
    headers: { 'Content-Type': 'application/json; charset=utf-8', ...CORS },
  });
</script>

<script>
/* ==========================================================================
   CONFIG
   ========================================================================== */
const CONFIG = {
  API_URL: 'https://resto-api.VOTRE-COMPTE.workers.dev', // URL de votre Worker

const $ = (s) => document.querySelector(s);

  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const isValidId = (v) => /^[a-zA-Z0-9_-]{1,40}$/.test(v || '');

function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = `alert alert-${type} shadow-lg py-2`;
  el.innerHTML = `<span>${esc(msg)}</span>`;
  $('#toast').appendChild(el);
  setTimeout(() => el.remove(), 2800);
}

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.value = 0.1;
    osc.start();
    osc.stop(ctx.currentTime + 0.25);
  } catch (_) { /* son bloqué par le navigateur : pas grave */ }
}

/* ==========================================================================
   CONTEXTE : restaurantId, table, URL de l'API
   ========================================================================== */
const params = new URLSearchParams(location.search);

if (params.get('api')) localStorage.setItem('api_url', params.get('api'));
const API = (localStorage.getItem('api_url') || CONFIG.API_URL).replace(/\/$/, '');

if (isValidId(params.get('restaurant'))) localStorage.setItem('restaurantId', params.get('restaurant'));
let rid = localStorage.getItem('restaurantId') || '';

const table = params.get('table');
const MODE = table ? 'client' : 'admin';

async function api(path, { method = 'GET', body, admin = false } = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (admin) headers['X-Admin-Pin'] = sessionStorage.getItem('pin') || '';
  const res = await fetch(API + path, {
    method,
    headers,
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || `Erreur ${res.status}`), { status: res.status });
  return data;
}

const STATUS_LABEL = { pending: 'En attente', preparing: 'En préparation', ready: 'Prête', served: 'Servie' };
const STATUS_BADGE = { pending: 'badge-warning', preparing: 'badge-info', ready: 'badge-success', served: 'badge-ghost' };
const NEXT_STATUS = { pending: 'preparing', preparing: 'ready', ready: 'served' };
const NEXT_LABEL = { pending: 'Lancer la préparation', preparing: 'Marquer prête', ready: 'Marquer servie' };

const fmtMoney = (n, cur) => `${Number(n).toLocaleString('fr-FR')} ${cur || ''}`.trim();

/* ==========================================================================
   ESPACE CLIENT
   ========================================================================== */
const client = {
  menu: null,
  cart: {},            // { itemId: qty }
  activeCat: null,
  customer: localStorage.getItem('customerName') || '',
  note: '',
  trackId: localStorage.getItem('lastOrder:' + rid) || null,
  trackStatus: null,
  trackTimer: null
};

async function initClient() {
  $('#app').className = 'client-shell';
  if (!isValidId(rid)) {
    $('#app').innerHTML = alertBox('Lien invalide : identifiant du restaurant manquant.');
    return;
  }
  $('#app').innerHTML = '<div class="flex justify-center p-20"><span class="loading loading-spinner loading-lg"></span></div>';
  try {
    client.menu = await api('/api/menu?restaurant=' + encodeURIComponent(rid));
  } catch (e) {
    $('#app').innerHTML = alertBox('Impossible de charger le menu : ' + e.message);
    return;
  }
  client.activeCat = client.menu.categories[0]?.id || null;
  renderClient();
  if (client.trackId) startTracking();
}

const alertBox = (msg) => `<div class="p-4"><div class="alert alert-error"><span>${esc(msg)}</span></div></div>`;

function findItem(id) {
  for (const c of client.menu.categories) {
    const it = c.items.find((i) => i.id === id);
    if (it) return it;
  }
  return null;
}

const cartCount = () => Object.values(client.cart).reduce((a, b) => a + b, 0);
const cartTotal = () => Object.entries(client.cart)
  .reduce((sum, [id, qty]) => sum + (findItem(id)?.price || 0) * qty, 0);

function renderClient() {
  const { menu, activeCat } = client;
  const cur = menu.currency;
  const cats = menu.categories.filter((c) => c.items.some((i) => i.available !== false));
  const current = cats.find((c) => c.id === activeCat) || cats[0];

  const tabs = cats.map((c) => `
    <button class="tab ${current && c.id === current.id ? 'tab-active font-semibold' : ''}"
            onclick="setCat('${c.id}')">${esc(c.name)}</button>`).join('');

  const items = current ? current.items.filter((i) => i.available !== false).map((i) => {
    const qty = client.cart[i.id] || 0;
    return `
      <article class="client-item">
        <div class="client-item-info">
          <h3 class="client-item-name">${esc(i.name)}</h3>
          ${i.desc ? `<p class="client-item-desc">${esc(i.desc)}</p>` : ''}
          <p class="client-item-price">${fmtMoney(i.price, cur)}</p>
        </div>
        <div class="client-item-actions">
          ${qty > 0 ? `
            <button class="btn btn-circle btn-sm btn-outline" aria-label="Retirer un article" onclick="changeQty('${i.id}', -1)">−</button>

        </div>

  }).join('') : '<p class="text-center opacity-60 p-10">Le menu est vide pour le moment.</p>';

  const bar = cartCount() ? `
    <div class="client-cart-bar">
      <button class="btn btn-primary btn-block mx-auto flex justify-between items-center" onclick="openCart()">

  $('#app').innerHTML = `

          <h1 class="capitalize">${esc(rid)}</h1>
          <div class="text-xs text-white/60 mt-1">Découvrez notre carte et commandez à votre rythme</div>

    <div id="track-banner"></div>
    <div class="client-welcome">
      <h2>Notre carte 🍽️</h2>
      <p>Des saveurs à découvrir, préparées avec soin.</p>

    <div class="client-items">${items}</div>
    ${bar}`;
  renderTrackBanner();
}

function setCat(id) { client.activeCat = id; renderClient(); }

function changeQty(id, delta) {
  const qty = Math.max(0, (client.cart[id] || 0) + delta);
  if (qty) client.cart[id] = qty; else delete client.cart[id];
  renderClient();
  if ($('#cart-modal').open) renderCartBody();
}

function openCart() {
  renderCartBody();
  $('#cart-modal').showModal();
}

function renderCartBody() {
  const cur = client.menu.currency;
  const lines = Object.entries(client.cart).map(([id, qty]) => {
    const it = findItem(id);
    if (!it) return '';
    return `
      <div class="flex items-center justify-between gap-2 py-2 border-b border-base-200">
        <div class="flex-1 min-w-0">
          <div class="font-medium">${esc(it.name)}</div>

          <button class="btn btn-circle btn-xs btn-primary" onclick="changeQty('${id}', 1)">+</button>
        </div>

  }).join('');

  if (!lines) {
    $('#cart-body').innerHTML = `
      <h3 class="font-bold text-lg mb-2">Votre panier</h3>

    ${lines}
    <div class="flex justify-between items-center font-extrabold text-lg py-4">

      <span class="text-primary">${fmtMoney(cartTotal(), cur)}</span>

           class="input input-bordered w-full mb-3"
           value="${esc(client.customer)}" oninput="client.customer = this.value">
    <label class="text-sm font-bold mb-1">Une précision ?</label>

              rows="3" class="textarea textarea-bordered w-full mb-4"
              oninput="client.note = this.value">${esc(client.note)}</textarea>
    <div class="flex gap-2">
      <button class="btn btn-ghost flex-1" onclick="$('#cart-modal').close()">Continuer</button>
      <button id="send-btn" class="btn btn-primary flex-1" onclick="submitOrder()">Confirmer la commande</button>
    </div>`;
}

async function submitOrder() {
  const name = client.customer.trim();
  if (!name) { toast('Indiquez votre nom', 'warning'); $('#c-name')?.focus(); return; }
  if (!cartCount()) return;

  const btn = $('#send-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading loading-spinner loading-sm"></span>';
  try {
    const items = Object.entries(client.cart).map(([id, qty]) => ({ id, qty }));
    const res = await api('/api/order', {
      method: 'POST',
      body: { restaurant: rid, table, customer: name, items, note: client.note.trim() }
    });
    localStorage.setItem('customerName', name);
    localStorage.setItem('lastOrder:' + rid, res.id);
    client.trackId = res.id;
    client.trackStatus = 'pending';
    client.cart = {};
    client.note = '';
    $('#cart-modal').close();
    renderClient();
    startTracking();
    toast('Commande envoyée ✔');
  } catch (e) {
    toast(e.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Commander';
  }
}

/* --- Suivi de commande côté client --- */
function startTracking() {
  clearInterval(client.trackTimer);
  pollTracking();
  client.trackTimer = setInterval(pollTracking, CONFIG.POLL_MS);
}

async function pollTracking() {
  if (!client.trackId) return;
  try {
    const res = await api(`/api/order?restaurant=${encodeURIComponent(rid)}&id=${encodeURIComponent(client.trackId)}`);
    client.trackStatus = res.status;
    renderTrackBanner();
    if (res.status === 'served') clearInterval(client.trackTimer);
  } catch (e) {
    if (e.status === 404) stopTracking();
  }
}

function stopTracking() {
  clearInterval(client.trackTimer);
  localStorage.removeItem('lastOrder:' + rid);
  client.trackId = null;
  client.trackStatus = null;
  renderTrackBanner();
}

function renderTrackBanner() {
  const el = $('#track-banner');
  if (!el) return;
  if (!client.trackId) { el.innerHTML = ''; return; }
  const st = client.trackStatus;
  el.innerHTML = `
    <div class="alert m-3 mb-0 shadow-sm">
      <div class="flex-1">
        <div class="text-sm opacity-70">Commande #${esc(client.trackId)}</div>
        <div class="font-semibold">${st ? STATUS_LABEL[st] : '…'}
          ${st ? `<span class="badge ${STATUS_BADGE[st]} ml-1"></span>` : ''}</div>
      </div>
      ${st === 'served' ? '<button class="btn btn-sm" onclick="stopTracking()">OK</button>' : ''}
    </div>`;
}

/* ==========================================================================
   ESPACE ADMIN
   ========================================================================== */
const admin = {
  tab: 'orders',
  orders: [],
  menu: null,        // brouillon du menu en cours d'édition
  showServed: false,
  timer: null,
  prevPending: null
};

function initAdmin() {
  $('#app').className = 'max-w-5xl mx-auto p-3 pb-24';
  if (sessionStorage.getItem('pin') && isValidId(rid)) {
    api('/api/auth', { method: 'POST', admin: true, body: { restaurant: rid } })
      .then(renderAdminShell)
      .catch(renderLogin);
  } else {
    renderLogin();
  }
}

function renderLogin(err) {
  $('#app').innerHTML = `
    <div class="login-card card">
      <div class="card-body">
        <div class="login-logo">🍽️</div>
        <div class="text-xs font-bold tracking-widest text-primary uppercase">Espace professionnel</div>
        <h1>Bienvenue !</h1>
        <p class="login-subtitle">Connectez-vous pour gérer votre restaurant.</p>
        <label class="text-sm font-bold">Identifiant du restaurant</label>
        <input id="l-rid" class="input input-bordered w-full" placeholder="Ex : mimo" value="${esc(rid)}">
        <label class="text-sm font-bold">Code PIN administrateur</label>
        <input id="l-pin" type="password" inputmode="numeric" class="input input-bordered w-full" placeholder="Votre code PIN"
               onkeydown="if(event.key==='Enter') login()">
        <details class="text-sm mt-1">
          <summary class="cursor-pointer text-primary font-semibold">Configuration du serveur</summary>
          <input id="l-api" class="input input-bordered input-sm w-full mt-3" value="${esc(API)}">
        </details>
        ${err ? `<div class="alert alert-error text-sm">${esc(err.message || err)}</div>` : ''}
        <button class="btn btn-primary btn-block mt-2" onclick="login()">Se connecter</button>
        <button class="btn btn-ghost btn-sm" onclick="renderSetup()">⚙️ Installer le Worker</button>
        <p class="text-center text-xs opacity-40 mt-2">Gestion sécurisée de votre établissement</p>
      </div>
    </div>`;
}

async function login() {
  const newRid = $('#l-rid').value.trim();
  const pin = $('#l-pin').value.trim();
  const apiUrl = $('#l-api').value.trim();
  if (!isValidId(newRid)) return renderLogin('Identifiant invalide (lettres, chiffres, - et _).');
  if (!pin) return renderLogin('Saisissez le PIN.');

  if (apiUrl && apiUrl !== API) {
    localStorage.setItem('api_url', apiUrl);
    // l'URL de l'API est lue au chargement : on recharge après avoir mémorisé les infos
    localStorage.setItem('restaurantId', newRid);
    sessionStorage.setItem('pin', pin);
    location.reload();
    return;
  }

  rid = newRid;
  localStorage.setItem('restaurantId', rid);
  sessionStorage.setItem('pin', pin);
  try {
    await api('/api/auth', { method: 'POST', admin: true, body: { restaurant: rid } });
    beep(); // débloque l'audio pour les notifications de nouvelles commandes
    renderAdminShell();
  } catch (e) {
    sessionStorage.removeItem('pin');
    renderLogin(e.status === 401 ? 'PIN incorrect.' : e.message);
  }
}

function logout() {
  clearInterval(admin.timer);
  sessionStorage.removeItem('pin');
  renderLogin();
}

/* --- Installation du Worker via le dashboard Cloudflare --- */
function renderSetup() {
  $('#app').innerHTML = `
    <div class="card bg-base-100 shadow-xl max-w-2xl mx-auto mt-6">
      <div class="card-body gap-3">
        <h1 class="card-title">⚙️ Installer le Worker (dashboard Cloudflare)</h1>
        <ol class="list-decimal pl-5 space-y-2 text-sm">
          <li><b>Workers &amp; Pages</b> → <i>Create</i> → <i>Create Worker</i> → nom <code>resto-api</code> → <i>Deploy</i>.</li>
          <li><i>Edit code</i> : supprimez tout, collez le code ci-dessous, puis <i>Deploy</i>.</li>
          <li><b>Storage &amp; Databases → KV</b> → <i>Create a namespace</i> nommé <code>ORDERS_KV</code>.</li>
          <li>Worker → <b>Settings → Bindings → Add → KV namespace</b> : nom de variable <code>ORDERS_KV</code>, choisissez le namespace créé, puis <i>Deploy</i>.</li>
          <li>Worker → <b>Settings → Variables and Secrets → Add</b> : type <i>Secret</i>, nom <code>ADMIN_PIN</code>, valeur = votre PIN.
              (Optionnel : <code>PINS</code> = <code>{"mimo":"1234"}</code> pour un PIN par restaurant.)</li>
          <li>Copiez l'URL <code>xxx.workers.dev</code> du Worker dans le champ « URL du Worker » de l'écran de connexion.</li>
        </ol>
        <textarea id="worker-code" readonly rows="12" class="textarea textarea-bordered font-mono text-xs w-full"></textarea>
        <div class="flex gap-2">
          <button class="btn btn-primary btn-sm" onclick="copyWorker()">📋 Copier le code</button>
          <button class="btn btn-sm" onclick="renderLogin()">← Retour</button>
        </div>
      </div>
    </div>`;
  $('#worker-code').value = $('#worker-source').textContent.trim();
}

async function copyWorker() {
  const area = $('#worker-code');
  try {
    await navigator.clipboard.writeText(area.value);
  } catch (_) {
    area.select();
    document.execCommand('copy');
  }
  toast('Code copié ✔');
}

function renderAdminShell() {
  $('#app').innerHTML = `
    <div class="admin-shell">
      <header class="admin-header">
        <div class="admin-brand">
          <div class="admin-brand-icon">🍽️</div>
          <div class="min-w-0">
            <div class="admin-brand-name capitalize">${esc(rid)}</div>
            <div class="admin-brand-subtitle">Espace de gestion du restaurant</div>
          </div>
        </div>
        <button class="btn btn-sm" onclick="logout()">Déconnexion</button>
      </header>
      <div id="admin-tabs" class="admin-navigation"></div>
      <main id="panel"></main>
    </div>`;
  renderAdminTabs();
  setTab('orders');
  startAdminPolling();
}

function renderAdminTabs() {
  const tabs = [['orders', 'Commandes'], ['menu', 'Menu'], ['qr', 'QR codes']];
  $('#admin-tabs').innerHTML = tabs.map(([id, label]) =>
    `<button class="tab ${admin.tab === id ? 'tab-active' : ''}" onclick="setTab('${id}')">${id === 'orders' ? '📋 ' : id === 'menu' ? '🍴 ' : '▦ '}${label}</button>`
  ).join('');
}

function setTab(tab) {
  admin.tab = tab;
  renderAdminTabs();
  if (tab === 'orders') renderOrders();
  if (tab === 'menu') loadMenuEditor();
  if (tab === 'qr') renderQrTab();
}

/* --- Commandes --- */
function startAdminPolling() {
  clearInterval(admin.timer);
  fetchOrders();
  admin.timer = setInterval(fetchOrders, CONFIG.POLL_MS);
}

async function fetchOrders() {
  try {
    const { orders } = await api(`/api/orders?restaurant=${encodeURIComponent(rid)}`, { admin: true });
    admin.orders = orders;
    const pending = orders.filter((o) => o.status === 'pending').length;
    if (admin.prevPending !== null && pending > admin.prevPending) { beep(); toast('Nouvelle commande !', 'info'); }
    admin.prevPending = pending;
    if (admin.tab === 'orders') renderOrders();
  } catch (e) {
    if (e.status === 401) logout();
  }
}

function renderOrders() {
  const sections = [['pending', 'En attente'], ['preparing', 'En préparation'], ['ready', 'Prêtes']];
  const sorted = [...admin.orders].sort((a, b) => a.createdAt - b.createdAt);

  const card = (o) => {
    const time = new Date(o.createdAt).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    return `
      <article class="admin-order-card">
        <div class="flex justify-between items-start gap-2">
          <div class="min-w-0">
            <div class="order-customer">Table ${esc(o.table)} · ${esc(o.customer)}</div>
            <div class="order-meta">Commande #${esc(o.id)} · ${time}</div>
          </div>
          <span class="badge ${STATUS_BADGE[o.status]}">${STATUS_LABEL[o.status]}</span>
        </div>
        <ul class="order-items">
          ${o.items.map((i) => `<li>${i.qty} × ${esc(i.name)}</li>`).join('')}
        </ul>
        ${o.note ? `<div class="text-xs italic bg-base-200 rounded-lg p-3 mb-3">📝 ${esc(o.note)}</div>` : ''}
        <div class="order-footer">
          <span class="order-total">${fmtMoney(o.total, '')}</span>
          ${NEXT_STATUS[o.status]
            ? `<button class="btn btn-primary btn-sm" onclick="setStatus('${o.id}', '${NEXT_STATUS[o.status]}')">${NEXT_LABEL[o.status]} →</button>`
            : '<span class="text-xs opacity-50">Terminée ✓</span>'}
        </div>
      </article>`;
  };

  const cols = sections.map(([status, label]) => {
    const list = sorted.filter((o) => o.status === status);
    return `
      <section class="admin-order-column">
        <h2 class="admin-order-column-title">
          <span>${label}</span>
          <span class="badge badge-sm">${list.length}</span>
        </h2>
        <div class="space-y-2">${list.map(card).join('') || '<p class="text-xs opacity-50 text-center py-5">Aucune commande</p>'}</div>
      </section>`;
  }).join('');

  const served = sorted.filter((o) => o.status === 'served').reverse();

  $('#panel').innerHTML = `
    <div class="mb-4">
      <h2 class="admin-panel-title">Suivi des commandes</h2>
      <p class="admin-panel-subtitle">Suivez et gérez les commandes de votre établissement en temps réel.</p>
    </div>
    <div class="admin-order-grid">${cols}</div>
    <div class="mt-5 bg-white rounded-2xl border border-base-200 p-4">
      <label class="label cursor-pointer justify-start gap-3">
        <input type="checkbox" class="checkbox checkbox-sm checkbox-primary" ${admin.showServed ? 'checked' : ''}
               onchange="admin.showServed = this.checked; renderOrders()">
        <span class="font-semibold text-sm">Afficher les commandes servies (${served.length})</span>
      </label>
      ${admin.showServed ? `<div class="grid gap-2 md:grid-cols-3 mt-3">${served.map(card).join('') || '<p class="text-sm opacity-50">Aucune commande servie.</p>'}</div>` : ''}
    </div>`;
}

async function setStatus(id, status) {
  try {
    await api('/api/status', { method: 'POST', admin: true, body: { restaurant: rid, id, status } });
    const o = admin.orders.find((x) => x.id === id);
    if (o) o.status = status;
    renderOrders();
  } catch (e) {
    toast(e.message, 'error');
  }
}

/* --- Éditeur de menu --- */
async function loadMenuEditor() {
  if (!admin.menu) {
    $('#panel').innerHTML = '<div class="flex justify-center p-10"><span class="loading loading-spinner"></span></div>';
    try {
      admin.menu = await api('/api/menu?restaurant=' + encodeURIComponent(rid));
    } catch (e) {
      $('#panel').innerHTML = alertBox(e.message);
      return;
    }
  }
  renderMenuEditor();
}

function renderMenuEditor() {
  const m = admin.menu;
  const cats = m.categories.map((c, ci) => `
    <section class="menu-category">
      <div class="menu-category-title">
        <span class="text-xl">🍴</span>
        <input class="input input-bordered input-sm flex-1" placeholder="Nom de la catégorie"
               value="${esc(c.name)}" oninput="admin.menu.categories[${ci}].name = this.value">
        <button class="btn btn-sm btn-ghost text-error" aria-label="Supprimer la catégorie" onclick="delCat(${ci})">🗑</button>
      </div>
      ${c.items.map((it, ii) => `
        <div class="menu-item-editor">
          <input class="input input-bordered input-sm menu-field-name" placeholder="Nom de l'article"
                 value="${esc(it.name)}" oninput="admin.menu.categories[${ci}].items[${ii}].name = this.value">
          <input class="input input-bordered input-sm menu-field-price" type="number" min="0" step="any" placeholder="Prix"
                 value="${it.price}" oninput="admin.menu.categories[${ci}].items[${ii}].price = Number(this.value) || 0">
          <input class="input input-bordered input-sm menu-field-desc" placeholder="Description"
                 value="${esc(it.desc || '')}" oninput="admin.menu.categories[${ci}].items[${ii}].desc = this.value">
          <label class="menu-field-availability flex items-center gap-1 text-xs cursor-pointer whitespace-nowrap">
            <input type="checkbox" class="toggle toggle-xs toggle-success" ${it.available !== false ? 'checked' : ''}
                   onchange="admin.menu.categories[${ci}].items[${ii}].available = this.checked">
            Dispo
          </label>
          <button class="btn btn-ghost btn-sm text-error menu-field-delete" aria-label="Supprimer l'article" onclick="delItem(${ci}, ${ii})">✕</button>
        </div>`).join('')}
      <button class="btn btn-sm btn-outline mt-2" onclick="addItem(${ci})">＋ Ajouter un article</button>
    </section>`).join('');

  $('#panel').innerHTML = `
    <div class="mb-4">
      <h2 class="admin-panel-title">Gestion du menu</h2>
      <p class="admin-panel-subtitle">Organisez vos catégories, vos articles et vos tarifs.</p>
    </div>
    <div class="menu-toolbar">
      <div class="flex items-center gap-2">
        <label class="text-sm font-semibold">Devise</label>
        <input class="input input-bordered input-sm w-24" value="${esc(m.currency || '')}"
               oninput="admin.menu.currency = this.value">
      </div>
      <div class="flex gap-2 flex-wrap ml-auto">
        <button class="btn btn-sm btn-outline" onclick="addCat()">＋ Catégorie</button>
        <button class="btn btn-sm btn-primary" onclick="saveMenu()">Enregistrer ✓</button>
      </div>
    </div>
    <div class="menu-editor">${cats || '<div class="bg-white rounded-2xl p-10 text-center text-sm opacity-60">Votre menu est vide. Ajoutez votre première catégorie pour commencer.</div>'}</div>`;
}

function addCat() { admin.menu.categories.push({ id: uid(), name: '', items: [] }); renderMenuEditor(); }
function delCat(ci) {
  if (confirm('Supprimer cette catégorie et tous ses articles ?')) {
    admin.menu.categories.splice(ci, 1);
    renderMenuEditor();
  }
}
function addItem(ci) {
  admin.menu.categories[ci].items.push({ id: uid(), name: '', price: 0, desc: '', available: true });
  renderMenuEditor();
}
function delItem(ci, ii) { admin.menu.categories[ci].items.splice(ii, 1); renderMenuEditor(); }

async function saveMenu() {
  try {
    const res = await api('/api/menu', { method: 'POST', admin: true, body: { restaurant: rid, menu: admin.menu } });
    admin.menu = res.menu; // version nettoyée par le serveur
    renderMenuEditor();
    toast('Menu enregistré ✔');
  } catch (e) {
    toast(e.message, 'error');
  }
}

/* --- QR codes --- */
function renderQrTab() {
  const defaultBase = location.origin + location.pathname;
  $('#panel').innerHTML = `
    <div class="mb-4">
      <h2 class="admin-panel-title">QR codes des tables</h2>
      <p class="admin-panel-subtitle">Permettez à vos clients de consulter le menu et commander directement depuis leur table.</p>
    </div>
    <div class="qr-config">
      <h3 class="qr-config-title">Configuration des QR codes</h3>
      <label class="text-xs font-semibold block mb-1">Adresse de votre application</label>
      <input id="qr-base" class="input input-bordered input-sm w-full mb-4" value="${esc(defaultBase)}">
      <div class="flex flex-wrap gap-3 items-end">
        <div>
          <label class="text-xs font-semibold block mb-1">Première table</label>
          <input id="qr-from" type="number" min="1" value="1" class="input input-bordered input-sm w-24">
        </div>
        <div>
          <label class="text-xs font-semibold block mb-1">Dernière table</label>
          <input id="qr-to" type="number" min="1" value="10" class="input input-bordered input-sm w-24">
        </div>
        <button class="btn btn-primary btn-sm" onclick="generateQr()">Générer les QR codes</button>
        <button class="btn btn-outline btn-sm" onclick="window.print()">🖨 Imprimer</button>
      </div>
    </div>
    <div id="qr-print">
      <div id="qr-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3"></div>
    </div>`;
  generateQr();
}

function generateQr() {
  const base = $('#qr-base').value.trim();
  const from = Math.max(1, parseInt($('#qr-from').value, 10) || 1);
  const to = Math.min(from + 99, Math.max(from, parseInt($('#qr-to').value, 10) || from)); // max 100 QR
  const grid = $('#qr-grid');
  grid.innerHTML = '';

  for (let t = from; t <= to; t++) {
    let link = `${base}?restaurant=${encodeURIComponent(rid)}&table=${t}`;
    if (API !== CONFIG.API_URL.replace(/\/$/, '')) link += `&api=${encodeURIComponent(API)}`;

    const card = document.createElement('div');
    card.className = 'qr-card card bg-white shadow-sm text-center';
    card.style.cursor = 'pointer';
    card.setAttribute('role', 'link');
    card.setAttribute('tabindex', '0');
    card.setAttribute('aria-label', `Ouvrir le menu client de la table ${t}`);

    card.addEventListener('click', () => {
      location.href = link;
    });

    card.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        location.href = link;
      }
    });

    card.innerHTML = `<div class="card-body p-3 items-center gap-1">
      <div class="font-bold text-black">Table ${t}</div><div class="qr-target"></div>
      <div class="text-xs text-gray-500">Cliquez ou scannez pour commander</div></div>`;
    grid.appendChild(card);

    new QRCode(card.querySelector('.qr-target'), { text: link, width: 160, height: 160, correctLevel: QRCode.CorrectLevel.M });
  }
}

/* ==========================================================================
   PWA : manifest généré à la volée
   ========================================================================== */
(function setupPwa() {
  const icon = 'data:image/svg+xml,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#f97316"/>' +
    '<text x="256" y="340" font-size="280" text-anchor="middle">🍽️</text></svg>');
  const manifest = {
    name: 'Commande Resto',
    short_name: 'Resto',
    start_url: location.href,
    display: 'standalone',
    background_color: '#ffffff',
    theme_color: '#f97316',
    icons: [{ src: icon, sizes: '512x512', type: 'image/svg+xml', purpose: 'any' }]
  };
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
  document.head.appendChild(link);
})();

/* ==========================================================================
   DÉMARRAGE
   ========================================================================== */
if (MODE === 'client') initClient(); else initAdmin();
</script>
